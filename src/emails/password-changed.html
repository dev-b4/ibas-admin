<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #334155; margin: 0; padding: 0; background-color: #f8fafc; }
    .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; overflow: hidden; margin-top: 40px; margin-bottom: 40px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .header { background-color: #150B2D; padding: 30px; text-align: center; }
    .header h1 { color: #ffffff; margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
    .content { padding: 40px 30px; }
    .footer { text-align: center; padding: 20px; color: #94a3b8; font-size: 12px; background-color: #f8fafc; border-top: 1px solid #e2e8f0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>B4 Capital</h1>
    </div>
    <div class="content">
      <h2>Senha Alterada</h2>
      <p>Olá,</p>
      <p>Sua senha do IBAS Admin foi alterada com sucesso.</p>
      <p>Se você não realizou esta alteração, entre em contato com a equipe de suporte imediatamente.</p>
    </div>
    <div class="footer">
      B4 Capital &middot; ibas.b4.capital
    </div>
  </div>
</body>
</html>
